services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartstock
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock
    ports:
      - "5432:5432"
    volumes:
      - smartstock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SMARTSTOCK_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@db:5432/smartstock
      SMARTSTOCK_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      SMARTSTOCK_EXPIRATION_SAFETY_DAYS: "2"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smartstock_postgres:
