name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartstock_test
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTSTOCK_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@localhost:5432/smartstock_test
      SMARTSTOCK_TEST_DATABASE_URL: postgresql+psycopg://smartstock:smartstock@localhost:5432/smartstock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[test]"
      - run: ruff check backend
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run fast tests
        run: pytest backend/tests --ignore=backend/tests/integration
      - name: Run PostgreSQL integration tests
        run: pytest backend/tests/integration -m postgres
